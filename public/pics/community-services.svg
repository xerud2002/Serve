<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fef3f2"/>
  <g>
    <!-- Community center building -->
    <rect x="180" y="100" width="240" height="140" fill="#dc2626" opacity="0.8" rx="10"/>
    <rect x="200" y="120" width="30" height="30" fill="white" rx="3"/>
    <rect x="240" y="120" width="30" height="30" fill="white" rx="3"/>
    <rect x="280" y="120" width="30" height="30" fill="white" rx="3"/>
    <rect x="320" y="120" width="30" height="30" fill="white" rx="3"/>
    <rect x="360" y="120" width="30" height="30" fill="white" rx="3"/>
    
    <!-- Ground floor windows -->
    <rect x="200" y="170" width="30" height="40" fill="white" rx="3"/>
    <rect x="240" y="170" width="30" height="40" fill="white" rx="3"/>
    <rect x="320" y="170" width="30" height="40" fill="white" rx="3"/>
    <rect x="360" y="170" width="30" height="40" fill="white" rx="3"/>
    
    <!-- Front door -->
    <rect x="275" y="180" width="50" height="60" fill="#1e7bf1" rx="25"/>
    <circle cx="315" cy="210" r="3" fill="white"/>
    
    <!-- Roof -->
    <path d="M160 100 L300 60 L440 100 Z" fill="#374151"/>
    
    <!-- Services symbols around building -->
    <!-- Hearing aid -->
    <circle cx="120" cy="160" r="20" fill="#f59e0b"/>
    <path d="M110 150 Q120 145 130 150 Q120 165 110 150" stroke="white" stroke-width="2" fill="none"/>
    
    <!-- Day trips bus -->
    <rect x="450" y="180" width="80" height="40" fill="#1e7bf1" rx="5"/>
    <circle cx="470" cy="230" r="12" fill="#374151"/>
    <circle cx="510" cy="230" r="12" fill="#374151"/>
    
    <!-- DBS check shield -->
    <path d="M100 260 Q90 250 100 240 Q110 250 100 260" fill="#16a34a"/>
    <path d="M95 250 L100 245 L105 250" stroke="white" stroke-width="2" fill="none"/>
    
    <!-- Support hands -->
    <path d="M480 120 Q500 110 520 120 Q500 140 480 120" fill="#dc2626" opacity="0.7"/>
  </g>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">Community Services</text>
  <text x="300" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Supporting independence together</text>
</svg>