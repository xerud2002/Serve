<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fef7ff"/>
  <g>
    <!-- Two people together -->
    <circle cx="250" cy="160" r="30" fill="#dc2626"/>
    <circle cx="350" cy="160" r="30" fill="#1e7bf1"/>
    <rect x="230" y="190" width="40" height="50" fill="#dc2626" rx="5"/>
    <rect x="330" y="190" width="40" height="50" fill="#1e7bf1" rx="5"/>
    
    <!-- Connecting heart -->
    <path d="M290 180 Q300 170 310 180 Q300 190 290 180" fill="#f59e0b"/>
    
    <!-- Conversation bubbles -->
    <ellipse cx="220" cy="130" rx="25" ry="15" fill="white" stroke="#dc2626" stroke-width="2"/>
    <ellipse cx="380" cy="130" rx="25" ry="15" fill="white" stroke="#1e7bf1" stroke-width="2"/>
    
    <!-- Hands reaching -->
    <path d="M270 200 Q290 190 310 200" stroke="#f59e0b" stroke-width="4" fill="none"/>
  </g>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">Befriending Service</text>
  <text x="300" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Companionship and emotional support</text>
</svg>