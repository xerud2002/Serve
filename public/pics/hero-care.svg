<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGradient)" />
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="40" fill="#ffffff" opacity="0.1"/>
  <circle cx="1100" cy="500" r="60" fill="#ffffff" opacity="0.1"/>
  <circle cx="200" cy="450" r="25" fill="#ffffff" opacity="0.15"/>
  <circle cx="1000" cy="150" r="35" fill="#ffffff" opacity="0.1"/>
  
  <!-- Main illustration elements -->
  <!-- House/Home symbol -->
  <g transform="translate(300,200)">
    <!-- House base -->
    <rect x="0" y="60" width="120" height="100" fill="#ffffff" opacity="0.9" rx="8"/>
    <!-- House roof -->
    <polygon points="60,0 0,60 120,60" fill="url(#accentGradient)" opacity="0.9"/>
    <!-- Door -->
    <rect x="45" y="100" width="30" height="60" fill="#1e40af" opacity="0.8" rx="4"/>
    <!-- Windows -->
    <rect x="20" y="80" width="20" height="20" fill="#1e40af" opacity="0.6" rx="2"/>
    <rect x="80" y="80" width="20" height="20" fill="#1e40af" opacity="0.6" rx="2"/>
    <!-- Door handle -->
    <circle cx="70" cy="130" r="2" fill="#1e40af"/>
  </g>
  
  <!-- Heart symbol for care -->
  <g transform="translate(500,250)">
    <path d="M60,20 C60,10 50,0 35,0 C20,0 10,10 10,20 C10,35 35,60 35,60 C35,60 60,35 60,20 Z" fill="#dc2626" opacity="0.8"/>
    <path d="M35,5 C45,5 55,10 60,20 C65,10 75,5 85,5 C100,5 110,15 110,30 C110,45 85,70 85,70 C85,70 60,45 60,30" fill="#dc2626" opacity="0.8"/>
  </g>
  
  <!-- People symbols -->
  <g transform="translate(700,220)">
    <!-- Person 1 -->
    <circle cx="20" cy="20" r="15" fill="#ffffff" opacity="0.8"/>
    <rect x="10" y="35" width="20" height="40" fill="#ffffff" opacity="0.8" rx="10"/>
    
    <!-- Person 2 (elderly with walking aid) -->
    <circle cx="60" cy="20" r="15" fill="#ffffff" opacity="0.7"/>
    <rect x="50" y="35" width="20" height="40" fill="#ffffff" opacity="0.7" rx="10"/>
    <!-- Walking stick -->
    <line x1="75" y1="45" x2="75" y2="75" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <circle cx="75" cy="45" r="2" fill="#ffffff" opacity="0.7"/>
    
    <!-- Person 3 (caregiver) -->
    <circle cx="100" cy="20" r="15" fill="#dc2626" opacity="0.8"/>
    <rect x="90" y="35" width="20" height="40" fill="#dc2626" opacity="0.8" rx="10"/>
    <!-- Care symbol on chest -->
    <path d="M100,45 C100,42 98,40 95,40 C92,40 90,42 90,45 C90,48 95,53 95,53 C95,53 100,48 100,45 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- Supporting hands -->
  <g transform="translate(200,350)">
    <ellipse cx="40" cy="20" rx="35" ry="15" fill="#ffffff" opacity="0.6" transform="rotate(-10)"/>
    <ellipse cx="80" cy="25" rx="35" ry="15" fill="#dc2626" opacity="0.6" transform="rotate(10)"/>
  </g>
  
  <!-- Text elements -->
  <text x="600" y="450" text-anchor="middle" fill="#ffffff" opacity="0.8" font-family="Arial, sans-serif" font-size="36" font-weight="bold">SERVE</text>
  <text x="600" y="490" text-anchor="middle" fill="#ffffff" opacity="0.6" font-family="Arial, sans-serif" font-size="18">Supporting Independence in Northamptonshire</text>
  
  <!-- Award badge -->
  <g transform="translate(50,450)">
    <ellipse cx="75" cy="25" rx="70" ry="20" fill="#fbbf24" opacity="0.9" rx="15"/>
    <text x="75" y="20" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10" font-weight="bold">🏆 Award Winner 2024</text>
    <text x="75" y="32" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="8">Best Homecare Team</text>
  </g>
  
  <!-- Decorative pattern -->
  <g opacity="0.1">
    <pattern id="dots" patternUnits="userSpaceOnUse" width="60" height="60">
      <circle cx="30" cy="30" r="2" fill="#ffffff"/>
    </pattern>
    <rect width="1200" height="600" fill="url(#dots)"/>
  </g>
</svg>