<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#eff6ff"/>
  <g>
    <!-- Transport vehicle -->
    <rect x="150" y="180" width="300" height="80" fill="#1e7bf1" rx="15"/>
    <!-- Wheels -->
    <circle cx="200" cy="280" r="25" fill="#374151"/>
    <circle cx="400" cy="280" r="25" fill="#374151"/>
    <circle cx="200" cy="280" r="15" fill="#6b7280"/>
    <circle cx="400" cy="280" r="15" fill="#6b7280"/>
    
    <!-- Windows -->
    <rect x="170" y="190" width="60" height="40" fill="#e5f3ff" rx="5"/>
    <rect x="240" y="190" width="40" height="40" fill="#e5f3ff" rx="5"/>
    <rect x="290" y="190" width="40" height="40" fill="#e5f3ff" rx="5"/>
    <rect x="340" y="190" width="40" height="40" fill="#e5f3ff" rx="5"/>
    <rect x="390" y="190" width="40" height="40" fill="#e5f3ff" rx="5"/>
    
    <!-- Door -->
    <rect x="420" y="200" width="20" height="60" fill="#dc2626" rx="3"/>
    
    <!-- SERVE text on side -->
    <text x="300" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">SERVE</text>
  </g>
  <text x="300" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#374151">Community Transport</text>
  <text x="300" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Safe, reliable transport services</text>
</svg>