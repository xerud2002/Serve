name: Deploy to VPS

# Builds the site on GitHub and ships the result to the VPS, so the server
# never has to build. Stays switched off until `npm run deploy:setup` has
# stored the SSH key and build settings (it sets VPS_DEPLOY_ENABLED to true).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # NEXT_PUBLIC_* values are compiled into the build, so they are needed here.
      # Server-only secrets (RESEND_API_KEY) stay in /var/www/serve/.env.local on the VPS.
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}

    steps:
      - name: Check deployment settings
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing. Run 'npm run deploy:setup' on your own machine."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:all

      - name: Build
        run: npm run build

      - name: Package release
        run: tar --exclude=.next/cache --exclude=.next/dev -czf serve-release.tar.gz .next public package.json package-lock.json next.config.js

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile $HOME/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 30
            ServerAliveInterval 30
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Upload release
        run: scp serve-release.tar.gz scripts/vps-activate.sh vps:/tmp/

      - name: Activate release
        run: ssh vps "sed -i 's/\r\$//' /tmp/vps-activate.sh && bash /tmp/vps-activate.sh /tmp/serve-release.tar.gz"

      - name: Check the live site
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 --output /dev/null https://serve.org.uk/

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
